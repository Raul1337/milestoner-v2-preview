<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universe · Enlarged text review</title>
<style>body{margin:0;padding:12px;font:16px system-ui;background:#edf1fa;color:#142047}header{max-width:1100px;margin:auto}h1{font-size:1.25rem}form{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}label{display:flex;gap:5px;align-items:center}select,a{min-height:44px}iframe{display:block;max-width:100%;height:844px;margin:16px auto;border:1px solid #6476a5;border-radius:14px;background:white}p{line-height:1.5}</style>
<header><a href="./">Volver a la revisión / Back to review</a><h1>Universe · V2.6.2a</h1><p>PENDING OWNER VISUAL AND FUNCTIONAL REVIEW. El marco muestra la aplicación real con texto ampliado. Utiliza sus datos locales de demo; no reinicia ni crea registros. La ampliación Web no equivale a Dynamic Type.</p>
<form><label>Texto / Text <select id="text"><option>100</option><option>150</option><option>200</option></select>%</label><label>Idioma <select id="lang"><option>es</option><option>en</option></select></label><label>Apariencia <select id="appearance"><option>dark</option><option>light</option></select></label><label>Ancho <select id="width"><option>320</option><option>375</option><option>390</option><option>428</option><option>768</option><option>1440</option></select></label><label>Vista <select id="view"><option value="you">Normal</option><option value="you/expanded">Expanded</option></select></label></form><p id="measurement" role="status"></p></header><iframe title="Milestoner Universe interactivo"></iframe>
<script>
const q=new URLSearchParams(location.search),ids=['text','lang','appearance','width','view'],frame=document.querySelector('iframe');
for(const id of ids){const el=document.getElementById(id),value=q.get(id);if([...el.options].some(o=>o.value===value))el.value=value;else if(id==='text')el.value='200';}
function apply(){const params=new URLSearchParams();for(const id of ids)params.set(id,document.getElementById(id).value);history.replaceState(null,'','?'+params);frame.style.width=params.get('width')+'px';const target=new URL('../?lang='+params.get('lang')+'&appearance='+params.get('appearance')+'#'+params.get('view'),location.href).href;if(frame.src!==target)frame.src=target;scaleFrame();}
function scaleFrame(){const doc=frame.contentDocument;if(!doc?.getElementById('root'))return;doc.documentElement.style.fontSize=document.getElementById('text').value+'%';document.getElementById('measurement').textContent='Viewport: '+frame.contentWindow.innerWidth+'px · texto: '+document.getElementById('text').value+'%';}frame.addEventListener('load',scaleFrame);
for(const id of ids)document.getElementById(id).addEventListener('change',apply);apply();
</script></html>
